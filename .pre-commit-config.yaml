# Local checks that mirror CI. Install once per clone with:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint src
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: pytest
        name: unit tests
        entry: env TEST_ENV=true DATABASE_URL=sqlite:///test.db SECRET_KEY=sekret uv run pytest src/tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
